plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

import groovy.json.JsonOutput
import groovy.json.JsonSlurper

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        biomemakeover {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

def stage3GeneratedResources = layout.buildDirectory.dir('generated/stage3Resources')
tasks.register('generateStage3ItemDefinitions') {
    inputs.file('validation/foundations/stage_3_mushroom_fields_contract.json')
    outputs.dir(stage3GeneratedResources)
    doLast {
        def contract = new JsonSlurper().parse(file('validation/foundations/stage_3_mushroom_fields_contract.json'))
        def ids = (contract.blocks + contract.standalone_items + contract.spawn_eggs).unique().sort()
        def output = stage3GeneratedResources.get().dir('assets/biomemakeover/items').asFile
        output.mkdirs()
        ids.each { id ->
            def definition = [model: [type: 'minecraft:model', model: "biomemakeover:item/${id}"]]
            new File(output, "${id}.json").text = JsonOutput.prettyPrint(JsonOutput.toJson(definition)) + System.lineSeparator()
        }
    }
}

processResources {
    dependsOn tasks.named('generateStage3ItemDefinitions')
    from(stage3GeneratedResources)
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }

    // Stage 3 parity resources are sourced verbatim from the pinned, tracked
    // 1.20.1 release tree. The includes are deliberately ownership-scoped;
    // structures and unrelated biome themes are excluded.
    from('reference/Biome-Makeover-1.20/common/src/main/resources') {
        include 'assets/biomemakeover/blockstates/*glowshroom*.json'
        include 'assets/biomemakeover/blockstates/*mushroom_brick*.json'
        include 'assets/biomemakeover/blockstates/*mushroom_stem_brick*.json'
        include 'assets/biomemakeover/blockstates/glowshroom_stem*.json'
