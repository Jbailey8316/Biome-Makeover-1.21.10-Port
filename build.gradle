plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import javax.imageio.ImageIO
import java.awt.image.BufferedImage
import java.util.zip.ZipFile

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        biomemakeover {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

def stage3GeneratedResources = layout.buildDirectory.dir('generated/stage3Resources')
def stage4GeneratedResources = layout.buildDirectory.dir('generated/stage4Resources')
def stage5GeneratedResources = layout.buildDirectory.dir('generated/stage5Resources')
tasks.register('generateStage3ItemDefinitions') {
    inputs.file('validation/foundations/stage_3_mushroom_fields_contract.json')
    outputs.dir(stage3GeneratedResources)
    doLast {
        def contract = new JsonSlurper().parse(file('validation/foundations/stage_3_mushroom_fields_contract.json'))
        def ids = (contract.blocks + contract.standalone_items + contract.spawn_eggs).unique().sort()
        def output = stage3GeneratedResources.get().dir('assets/biomemakeover/items').asFile
        output.mkdirs()
        ids.each { id ->
            def definition = [model: [type: 'minecraft:model', model: "biomemakeover:item/${id}"]]
            new File(output, "${id}.json").text = JsonOutput.prettyPrint(JsonOutput.toJson(definition)) + System.lineSeparator()
        }
    }
}

tasks.register('generateStage4ItemDefinitions') {
    inputs.file('validation/foundations/stage_4_badlands_contract.json')
    inputs.files(
        'reference/Biome-Makeover-1.20/common/src/main/resources/assets/biomemakeover/textures/permutations/buds/bud.png',
        'reference/Biome-Makeover-1.20/common/src/main/resources/assets/biomemakeover/textures/permutations/buds/color_palettes/bud_palette.png',
        'reference/Biome-Makeover-1.20/common/src/main/resources/assets/biomemakeover/textures/permutations/buds/color_palettes/pink_bud.png'
    )
    outputs.dir(stage4GeneratedResources)
    doLast {
        def contract = new JsonSlurper().parse(file('validation/foundations/stage_4_badlands_contract.json'))
        def ids = contract.registry.blocks_with_items + contract.registry.items + contract.registry.spawn_eggs
        def output = stage4GeneratedResources.get().dir('assets/biomemakeover/items').asFile
        output.mkdirs()
        ids.unique().sort().each { id ->
            new File(output, "${id}.json").text = JsonOutput.prettyPrint(JsonOutput.toJson(
                [model: [type: 'minecraft:model', model: "biomemakeover:item/${id}"]])) + System.lineSeparator()
        }
        def clientJar = fileTree("${projectDir}/.gradle/loom-cache/minecraftMaven").matching {
            include '**/minecraft-clientOnly-*.jar'
        }.files.sort { it.absolutePath }.last()
        def eggColors = [glowfish_spawn_egg:[0xdea26a,0xdea26a], scuttler_spawn_egg:[0x473427,0x806553], cowboy_spawn_egg:[0x9bc2c2,0x6b3f39]]
        def textureOutput = stage4GeneratedResources.get().dir('assets/biomemakeover/textures/item').asFile
        def modelOutput = stage4GeneratedResources.get().dir('assets/biomemakeover/models/item').asFile
        textureOutput.mkdirs()
        modelOutput.mkdirs()
        new ZipFile(clientJar).withCloseable { zip ->
            def template = ImageIO.read(zip.getInputStream(zip.getEntry('assets/minecraft/textures/item/pig_spawn_egg.png')))
            eggColors.each { id, colors ->
                def image = new BufferedImage(template.width, template.height, BufferedImage.TYPE_INT_ARGB)
                for (int x=0; x<template.width; x++) for (int y=0; y<template.height; y++) {
                    int argb=template.getRGB(x,y), alpha=(argb>>>24)&255
                    if(alpha==0){image.setRGB(x,y,0);continue}
                    int r=(argb>>>16)&255,g=(argb>>>8)&255,b=argb&255,brightness=(r+g+b)/3
                    int target=brightness<190?colors[1]:colors[0]
                    float shade=brightness/220F
                    int tr=Math.min(255,Math.round(((target>>>16)&255)*shade))
                    int tg=Math.min(255,Math.round(((target>>>8)&255)*shade))
                    int tb=Math.min(255,Math.round((target&255)*shade))
                    image.setRGB(x,y,(alpha<<24)|(tr<<16)|(tg<<8)|tb)
                }
                ImageIO.write(image,'png',new File(textureOutput,"${id}.png"))
                new File(modelOutput,"${id}.json").text=JsonOutput.prettyPrint(JsonOutput.toJson(
                    [parent:'minecraft:item/generated',textures:[layer0:"biomemakeover:item/${id}"]]))+System.lineSeparator()
            }
        }
        def budRoot=file('reference/Biome-Makeover-1.20/common/src/main/resources/assets/biomemakeover/textures/permutations/buds')
        def bud=ImageIO.read(new File(budRoot,'bud.png'))
        def sourcePalette=ImageIO.read(new File(budRoot,'color_palettes/bud_palette.png'))
        def pinkPalette=ImageIO.read(new File(budRoot,'color_palettes/pink_bud.png'))
        def palette=[:]
        for(int x=0;x<sourcePalette.width;x++) for(int y=0;y<sourcePalette.height;y++) palette[sourcePalette.getRGB(x,y)]=pinkPalette.getRGB(x,y)
        def pinkBud=new BufferedImage(bud.width,bud.height,BufferedImage.TYPE_INT_ARGB)
        for(int x=0;x<bud.width;x++) for(int y=0;y<bud.height;y++) {
            int color=bud.getRGB(x,y); pinkBud.setRGB(x,y,palette.containsKey(color)?palette[color]:color)
        }
        def budOutput=stage4GeneratedResources.get().dir('assets/biomemakeover/textures/permutations/buds').asFile
        budOutput.mkdirs(); ImageIO.write(pinkBud,'png',new File(budOutput,'bud_pink.png'))
        def itemBudOutput=stage4GeneratedResources.get().dir('assets/biomemakeover/textures/item').asFile
        itemBudOutput.mkdirs(); ImageIO.write(pinkBud,'png',new File(itemBudOutput,'pink_bud_overlay.png'))
    }
}

tasks.register('generateStage5ItemDefinitions') {
    inputs.file('validation/foundations/stage_5_swamp_contract.json')
    inputs.files(
        'reference/Biome-Makeover-1.20/common/src/main/resources/assets/biomemakeover/textures/permutations/buds/bud.png',
        'reference/Biome-Makeover-1.20/common/src/main/resources/assets/biomemakeover/textures/permutations/buds/color_palettes/bud_palette.png',
        'reference/Biome-Makeover-1.20/common/src/main/resources/assets/biomemakeover/textures/permutations/buds/color_palettes/magenta_bud.png'
    )
    outputs.dir(stage5GeneratedResources)
    doLast {
        def contract = new JsonSlurper().parse(file('validation/foundations/stage_5_swamp_contract.json'))
        def ids = contract.blocks_with_items + contract.special_items + contract.spawn_eggs
        def output = stage5GeneratedResources.get().dir('assets/biomemakeover/items').asFile
        output.mkdirs()
        ids.unique().sort().each { id ->
            def model = [type: 'minecraft:model', model: "biomemakeover:item/${id}"]
            // Historical simple block-with-item color providers tinted both render paths.
            // Vanilla 1.21.10 foliage definitions apply the tint directly to the block model;
            // routing through the legacy item-model parent leaves item render paths untinted.
            if (id == 'willow_leaves') {
                model.model = 'biomemakeover:block/willow_leaves'
                model.tints = [[type:'minecraft:constant', value:-12012264]]
            }
            if (id == 'swamp_cypress_leaves') {
                model.model = 'biomemakeover:block/swamp_cypress_leaves'
                model.tints = [[type:'minecraft:constant', value:-8082577]]
            }
            if (id == 'small_lily_pad' || id == 'water_lily') {
                model.tints = [[type:'minecraft:constant', value:-13312764]]
            }
            new File(output, "${id}.json").text = JsonOutput.prettyPrint(JsonOutput.toJson([model:model])) + System.lineSeparator()
        }
        def clientJar = fileTree("${projectDir}/.gradle/loom-cache/minecraftMaven").matching { include '**/minecraft-clientOnly-*.jar' }.files.sort { it.absolutePath }.last()
        def eggColors = [decayed_spawn_egg:[0x2e7068,0x4a4034],dragonfly_spawn_egg:[0xc7b634,0xf2ebb6],lightning_bug_spawn_egg:[0x62c961,0x96ebe1]]
        def textureOutput=stage5GeneratedResources.get().dir('assets/biomemakeover/textures/item').asFile
        def modelOutput=stage5GeneratedResources.get().dir('assets/biomemakeover/models/item').asFile
        textureOutput.mkdirs();modelOutput.mkdirs()
        new ZipFile(clientJar).withCloseable { zip ->
            def template=ImageIO.read(zip.getInputStream(zip.getEntry('assets/minecraft/textures/item/pig_spawn_egg.png')))
            eggColors.each { id,colors ->
                def image=new BufferedImage(template.width,template.height,BufferedImage.TYPE_INT_ARGB)
                for(int x=0;x<template.width;x++)for(int y=0;y<template.height;y++){
                    int argb=template.getRGB(x,y),alpha=(argb>>>24)&255;if(alpha==0){image.setRGB(x,y,0);continue}
                    int brightness=(((argb>>>16)&255)+((argb>>>8)&255)+(argb&255))/3,target=brightness<190?colors[1]:colors[0];float shade=brightness/220F
                    int pixel=(alpha<<24)|(Math.min(255,Math.round(((target>>>16)&255)*shade))<<16)|(Math.min(255,Math.round(((target>>>8)&255)*shade))<<8)|Math.min(255,Math.round((target&255)*shade))
                    image.setRGB(x,y,pixel)
                }
                ImageIO.write(image,'png',new File(textureOutput,"${id}.png"))
                new File(modelOutput,"${id}.json").text=JsonOutput.prettyPrint(JsonOutput.toJson([parent:'minecraft:item/generated',textures:[layer0:"biomemakeover:item/${id}"]]))+System.lineSeparator()
            }
        }
        def budRoot=file('reference/Biome-Makeover-1.20/common/src/main/resources/assets/biomemakeover/textures/permutations/buds')
        def bud=ImageIO.read(new File(budRoot,'bud.png')),sourcePalette=ImageIO.read(new File(budRoot,'color_palettes/bud_palette.png'))
        def targetPalette=ImageIO.read(new File(budRoot,'color_palettes/magenta_bud.png')),palette=[:]
        for(int x=0;x<sourcePalette.width;x++)for(int y=0;y<sourcePalette.height;y++)palette[sourcePalette.getRGB(x,y)]=targetPalette.getRGB(x,y)
        def magenta=new BufferedImage(bud.width,bud.height,BufferedImage.TYPE_INT_ARGB)
        for(int x=0;x<bud.width;x++)for(int y=0;y<bud.height;y++){int color=bud.getRGB(x,y);magenta.setRGB(x,y,palette.containsKey(color)?palette[color]:color)}
        ImageIO.write(magenta,'png',new File(textureOutput,'magenta_bud_overlay.png'))
    }
}

