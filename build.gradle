        include 'assets/biomemakeover/textures/block/buttonbush*.png', 'assets/biomemakeover/textures/block/marigold*.png', 'assets/biomemakeover/textures/block/cattail*.png', 'assets/biomemakeover/textures/block/reed*.png', 'assets/biomemakeover/textures/block/small_lily_pad*.png', 'assets/biomemakeover/textures/block/water_lily*.png'
        include 'assets/biomemakeover/textures/block/lightning_bug_bottle.png', 'assets/biomemakeover/textures/item/lightning_bug_in_a_bottle.png*'
        include 'assets/biomemakeover/textures/item/*willow*.png', 'assets/biomemakeover/textures/item/*swamp_cypress*.png'
        include 'assets/biomemakeover/textures/item/water_lily.png', 'assets/biomemakeover/textures/item/small_lily_pad.png', 'assets/biomemakeover/textures/item/buttonbush.png', 'assets/biomemakeover/textures/item/marigold.png', 'assets/biomemakeover/textures/item/cattail.png', 'assets/biomemakeover/textures/item/reed.png'
        include 'assets/biomemakeover/textures/entity/decayed*.png', 'assets/biomemakeover/textures/entity/dragonfly/*.png', 'assets/biomemakeover/textures/entity/lightning_bug*.png'
