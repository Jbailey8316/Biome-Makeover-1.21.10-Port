        include 'data/biomemakeover/worldgen/configured_feature/swamp/*.json'
        include 'data/biomemakeover/worldgen/placed_feature/swamp/*.json'
        include 'data/biomemakeover/loot_tables/blocks/*willow*.json', 'data/biomemakeover/loot_tables/blocks/*swamp_cypress*.json'
        include 'data/biomemakeover/loot_tables/blocks/*peat*.json'
        include 'data/biomemakeover/loot_tables/blocks/buttonbush.json', 'data/biomemakeover/loot_tables/blocks/marigold.json', 'data/biomemakeover/loot_tables/blocks/cattail.json', 'data/biomemakeover/loot_tables/blocks/reed*.json', 'data/biomemakeover/loot_tables/blocks/small_lily_pad.json', 'data/biomemakeover/loot_tables/blocks/water_lily.json'
        include 'data/biomemakeover/loot_tables/blocks/lightning_bug_bottle.json'
        include 'data/biomemakeover/loot_tables/entities/decayed.json', 'data/biomemakeover/loot_tables/entities/dragonfly.json', 'data/biomemakeover/loot_tables/entities/lightning_bug*.json'
        include 'data/biomemakeover/recipes/wood/willow/**/*.json', 'data/biomemakeover/recipes/wood/swamp_cypress/**/*.json'
        exclude 'data/biomemakeover/recipes/wood/**/*_boat.json'
        exclude 'data/biomemakeover/recipes/wood/**/*_chest_boat.json'
        include 'data/biomemakeover/recipes/decoration/dried_peat_bricks/**/*.json', 'data/biomemakeover/recipes/decoration/mossy_dried_peat_bricks/**/*.json', 'data/biomemakeover/recipes/decoration/cracked_dried_peat_bricks/**/*.json', 'data/biomemakeover/recipes/decoration/reed_thatch/**/*.json'
        include 'data/biomemakeover/recipes/dried_peat.json', 'data/biomemakeover/recipes/dried_peat_from_mossy.json', 'data/biomemakeover/recipes/mossy_peat.json'
        include 'data/biomemakeover/recipes/dye/magenta_buds_from_water_lily.json', 'data/biomemakeover/recipes/dye/magenta_dye_from_magenta_bud.json', 'data/biomemakeover/recipes/dye/orange_dye_from_marigold.json'
        include 'data/biomemakeover/advancements/biomemakeover/enter_swamp.json', 'data/biomemakeover/advancements/biomemakeover/create_peat_farmland.json', 'data/biomemakeover/advancements/biomemakeover/obtain_peat.json', 'data/biomemakeover/advancements/biomemakeover/obtain_dried_peat.json'
        include 'data/biomemakeover/advancements/biomemakeover/lightning_bug_bottle.json'
        include 'data/biomemakeover/tags/blocks/lily_pads.json', 'data/biomemakeover/tags/blocks/peat.json', 'data/biomemakeover/tags/blocks/reeds.json'
        include 'data/biomemakeover/tags/items/peat.json', 'data/biomemakeover/tags/items/reeds.json'
        include 'data/biomemakeover/tags/entity_types/lightning_bugs.json'
        include 'data/biomemakeover/tags/worldgen/biome/swamps.json', 'data/biomemakeover/tags/worldgen/biome/swamp_bonemeal.json'
        eachFile { details ->
            details.path = details.path.replace('/loot_tables/','/loot_table/').replace('/recipes/','/recipe/')
                .replace('/advancements/','/advancement/').replace('/tags/blocks/','/tags/block/')
                .replace('/tags/items/','/tags/item/').replace('/tags/entity_types/','/tags/entity_type/')
        }
    }

    // Stage 4 Badlands-owned released resources. Ghost Town archaeology,
    // suspicious red sand, pottery sherds and the Badlands disc are excluded.
    from('reference/Biome-Makeover-1.20/common/src/main/resources') {
        include 'assets/biomemakeover/blockstates/*terracotta_brick*.json'
        include 'assets/biomemakeover/blockstates/cracked_brick*.json'
        include 'assets/biomemakeover/blockstates/paydir*.json'
        include 'assets/biomemakeover/blockstates/*cactus*.json'
        include 'assets/biomemakeover/blockstates/tumbleweed.json'
        include 'assets/biomemakeover/models/block/*terracotta_brick*.json'
        include 'assets/biomemakeover/models/block/cracked_brick*.json'
        include 'assets/biomemakeover/models/block/decoration/cracked_bricks/**/*.json'
        include 'assets/biomemakeover/models/block/paydir*.json'
        include 'assets/biomemakeover/models/block/*cactus*.json'
        include 'assets/biomemakeover/models/block/tumbleweed.json'
        include 'assets/biomemakeover/models/item/*terracotta_brick*.json'
        include 'assets/biomemakeover/models/item/cracked_brick*.json'
        include 'assets/biomemakeover/models/item/paydir*.json'
        include 'assets/biomemakeover/models/item/*cactus*.json'
        include 'assets/biomemakeover/models/item/scuttler_tail.json'
        include 'assets/biomemakeover/models/item/pink_bud.json'
        include 'assets/biomemakeover/models/item/cowboy_hat.json'
        include 'assets/biomemakeover/textures/block/*terracotta_brick*.png'
        include 'assets/biomemakeover/textures/block/cracked_brick*.png'
        include 'assets/biomemakeover/textures/block/paydir*.png'
        include 'assets/biomemakeover/textures/block/*cactus*.png'
        include 'assets/biomemakeover/textures/block/tumbleweed.png'
        include 'assets/biomemakeover/textures/block/tumbleweeb.png'
        include 'assets/biomemakeover/textures/item/scuttler_tail.png'
        include 'assets/biomemakeover/textures/item/pink_bud.png'
        include 'assets/biomemakeover/textures/item/bud_base.png'
        include 'assets/biomemakeover/textures/item/mycelium_sprouts.png'
        include 'assets/biomemakeover/textures/item/cracked_brick.png'
        include 'assets/biomemakeover/textures/item/cowboy_hat.png'
        include 'assets/biomemakeover/textures/misc/cowboy_hat.png'
        include 'assets/biomemakeover/textures/entity/scuttler.png'
        include 'assets/biomemakeover/textures/entity/cowboy.png'
        include 'assets/biomemakeover/sounds/rattle_*.ogg'
        include 'assets/biomemakeover/sounds/scuttler_*.ogg'
        include 'data/biomemakeover/worldgen/configured_feature/badlands/*.json'
        include 'data/biomemakeover/worldgen/placed_feature/badlands/*.json'
        include 'data/biomemakeover/loot_tables/blocks/*terracotta_brick*.json'
        include 'data/biomemakeover/loot_tables/blocks/cracked_brick*.json'
        include 'data/biomemakeover/loot_tables/blocks/paydir*.json'
        include 'data/biomemakeover/loot_tables/blocks/*cactus*.json'
        include 'data/biomemakeover/loot_tables/entities/scuttler.json'
        include 'data/biomemakeover/loot_tables/gameplay/scuttler_eating.json'
        include 'data/biomemakeover/recipes/decoration/terracotta_bricks/**/*.json'
        include 'data/biomemakeover/recipes/decoration/cracked_bricks/**/*.json'
        include 'data/biomemakeover/recipes/cracked_brick.json'
        include 'data/biomemakeover/recipes/dye/pink_dye_from_pink_bud.json'
        include 'data/biomemakeover/advancements/biomemakeover/enter_badlands.json'
        include 'data/biomemakeover/advancements/biomemakeover/cacti.json'
        include 'data/biomemakeover/advancements/biomemakeover/scuttler_tail.json'
        include 'data/biomemakeover/advancements/biomemakeover/pink_bud.json'
        include 'data/biomemakeover/tags/blocks/*cactus*.json'
        include 'data/biomemakeover/tags/items/scuttler_food.json'
        include 'data/biomemakeover/tags/items/barrel_cactus_immune.json'
        include 'data/biomemakeover/tags/items/additional_camel_food.json'
        include 'data/biomemakeover/tags/damage_type/scuttler_immune_to.json'
        include 'data/biomemakeover/tags/damage_type/tumbleweed_immune_to.json'
        include 'data/biomemakeover/tags/worldgen/biome/spawns_tumbleweed.json'
        include 'data/biomemakeover/tags/worldgen/biome/badlands.json'
        eachFile { details ->
            details.path = details.path.replace('/loot_tables/','/loot_table/').replace('/recipes/','/recipe/')
                .replace('/advancements/','/advancement/').replace('/tags/blocks/','/tags/block/').replace('/tags/items/','/tags/item/')
        }
    }

    doLast {
        def swampBiomeTag = new File(destinationDir, 'data/biomemakeover/tags/worldgen/biome/swamps.json')
        swampBiomeTag.parentFile.mkdirs()
        swampBiomeTag.text = JsonOutput.prettyPrint(JsonOutput.toJson([replace:false, values:['minecraft:swamp','minecraft:mangrove_swamp']])) + System.lineSeparator()
        def swampBonemealTag = new File(destinationDir, 'data/biomemakeover/tags/worldgen/biome/swamp_bonemeal.json')
        swampBonemealTag.parentFile.mkdirs()
        swampBonemealTag.text = JsonOutput.prettyPrint(JsonOutput.toJson([replace:false, values:['#biomemakeover:swamps']])) + System.lineSeparator()
        def swampLogs = ['biomemakeover:willow_log','biomemakeover:stripped_willow_log','biomemakeover:willow_wood','biomemakeover:stripped_willow_wood',
                         'biomemakeover:swamp_cypress_log','biomemakeover:stripped_swamp_cypress_log','biomemakeover:swamp_cypress_wood','biomemakeover:stripped_swamp_cypress_wood']
        ['block/logs.json','block/logs_that_burn.json','item/logs.json','item/logs_that_burn.json'].each { path ->
            def tagFile = new File(destinationDir, "data/minecraft/tags/${path}")
            tagFile.parentFile.mkdirs()
            def tag = tagFile.exists() ? new JsonSlurper().parse(tagFile) : [replace:false,values:[]]
            tag.values = ((tag.values ?: []) + swampLogs).unique()
            tagFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(tag)) + System.lineSeparator()
        }
        def historicalRoot = file('reference/Biome-Makeover-1.20/common/src/main/resources/assets/biomemakeover')
        def soundOut = new File(destinationDir, 'assets/biomemakeover/sounds.json')
        def currentSounds = soundOut.exists() ? new JsonSlurper().parse(soundOut) : [:]
        def historicalSounds = new JsonSlurper().parse(new File(historicalRoot, 'sounds.json'))
        ['scuttler_rattle','scuttler_step','scuttler_hurt','scuttler_death','tumbleweed_tumble','tumbleweed_break'].each {
            currentSounds[it] = historicalSounds[it]
        }
        ['entity.dragonfly.loop','entity.dragonfly.hurt','entity.dragonfly.death','entity.decayed.swim','entity.decayed.step',
         'entity.decayed.hurt_water','entity.decayed.hurt','entity.decayed.death_water','entity.decayed.death',
         'entity.decayed.ambient_water','entity.decayed.ambient'].each { if (historicalSounds[it] != null) currentSounds[it] = historicalSounds[it] }
        soundOut.text = JsonOutput.prettyPrint(JsonOutput.toJson(currentSounds)) + System.lineSeparator()

        def langOut = new File(destinationDir, 'assets/biomemakeover/lang/en_us.json')
        def currentLang = langOut.exists() ? new JsonSlurper().parse(langOut) : [:]
        def historicalLang = new JsonSlurper().parse(new File(historicalRoot, 'lang/en_us.json'))
        def stage4Tokens = ['badlands','terracotta_brick','cracked_brick','paydirt','saguaro','barrel_cactus','scuttler','pink_bud','cowboy','tumbleweed']
        historicalLang.each { key, value -> if (stage4Tokens.any { key.contains(it) }) currentLang[key] = value }
        def stage5Tokens = ['swamp','willow','cypress','peat','reed','cattail','lily','buttonbush','marigold','decayed','dragonfly','lightning_bug','magenta_bud']
        historicalLang.each { key, value -> if (stage5Tokens.any { key.contains(it) }) currentLang[key] = value }
        langOut.text = JsonOutput.prettyPrint(JsonOutput.toJson(currentLang)) + System.lineSeparator()
    }

    doLast {
        def configuredRoot = destinationDir.toPath().resolve('data/biomemakeover/worldgen/configured_feature').toFile()
        if (configuredRoot.exists()) {
            fileTree(configuredRoot).matching { include '**/*.json' }.files.each { configuredFile ->
                def configured = new JsonSlurper().parse(configuredFile)
                def radius = configured.config?.xz_radius
                if (radius instanceof Map && radius.type == 'minecraft:uniform' && radius.value instanceof Map) {
                    radius.putAll(radius.remove('value'))
                    configuredFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(configured)) + System.lineSeparator()
                }
            }
        }
        def recipeRoot = destinationDir.toPath().resolve('data/biomemakeover/recipe').toFile()
        if (recipeRoot.exists()) {
            // These resources were swept in by broad historical family includes,
            // but their owning content is intentionally deferred or belongs to
            // Stage 5. Do not leave recipes pointing at absent registry entries.
            [
                'wood/blighted_balsa/blighted_balsa_boat.json',
                'wood/blighted_balsa/blighted_balsa_chest_boat.json',
                'decoration/terracotta_bricks/white_dye_from_buttonbush.json'
            ].each { new File(recipeRoot, it).delete() }
            fileTree(recipeRoot).matching { include '**/*.json' }.files.each { recipeFile ->
                def recipe = new JsonSlurper().parse(recipeFile)
                def ingredient = { value ->
                    if (value instanceof Map && value.item) return value.item
                    if (value instanceof Map && value.tag) return "#${value.tag}"
                    return value
                }
                if (recipe.key instanceof Map) recipe.key.replaceAll { k, v -> ingredient(v) }
                if (recipe.ingredient != null) recipe.ingredient = ingredient(recipe.ingredient)
                if (recipe.ingredients instanceof List) recipe.ingredients = recipe.ingredients.collect { ingredient(it) }
                if (recipe.result instanceof Map && recipe.result.item) {
                    recipe.result.id = recipe.result.remove('item')
                }
                if (recipe.result instanceof String) recipe.result = [id: recipe.result]
                // Vanilla renamed the chain item in 1.21.10. This preserves the
                // hanging-sign recipe's iron-chain input under its modern ID.
                if (recipe.key instanceof Map) recipe.key.replaceAll { k, v -> v == 'minecraft:chain' ? 'minecraft:iron_chain' : v }
                recipeFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(recipe)) + System.lineSeparator()
            }
        }
        def lootRoot = destinationDir.toPath().resolve('data/biomemakeover/loot_table').toFile()
        if (lootRoot.exists()) {
            fileTree(lootRoot).matching { include '**/*.json' }.files.each { lootFile ->
                def text=lootFile.text
                if(text.contains('minecraft:looting_enchant')){
                    def loot=new JsonSlurper().parseText(text)
                    def walk
                    walk={ node ->
                        if(node instanceof Map){
                            if(node.function=='minecraft:looting_enchant'){
                                node.function='minecraft:enchanted_count_increase';node.enchantment='minecraft:looting'
                            }
                            node.values().each{walk(it)}
                        } else if(node instanceof List) node.each{walk(it)}
                    }
                    walk(loot);lootFile.text=JsonOutput.prettyPrint(JsonOutput.toJson(loot))+System.lineSeparator()
                }
            }
            def decayedLoot=new File(lootRoot,'entities/decayed.json')
            if(decayedLoot.exists()){
                def loot=new JsonSlurper().parse(decayedLoot)
                def rarePool=loot.pools.find{pool->pool.conditions?.any{it.condition=='minecraft:random_chance_with_looting'}}
                if(rarePool){
                    def old=rarePool.conditions.find{it.condition=='minecraft:random_chance_with_looting'}
                    old.clear();old.putAll([condition:'minecraft:random_chance_with_enchanted_bonus',enchantment:'minecraft:looting',unenchanted_chance:0.05,enchanted_chance:[type:'minecraft:linear',base:0.06,per_level_above_first:0.01]])
                }
                decayedLoot.text=JsonOutput.prettyPrint(JsonOutput.toJson(loot))+System.lineSeparator()
            }
            // Released Willow/Cypress tables match vanilla leaf behavior, but their 1.20
            // tool predicates must use the 1.21.10 item/component predicate schema.
            ['willow_leaves.json', 'swamp_cypress_leaves.json'].each { leafName ->
                def leafLoot = new File(lootRoot, "blocks/${leafName}")
                if (leafLoot.exists()) {
                    def loot = new JsonSlurper().parse(leafLoot)
                    def modernizePredicate
                    modernizePredicate = { node ->
                        if (node instanceof Map) {
                            if (node.predicate instanceof Map) {
                                def predicate = node.predicate
                                if (predicate.items instanceof List && predicate.items.size() == 1) predicate.items = predicate.items[0]
                                if (predicate.item != null) {
                                    predicate.items = predicate.remove('item')
                                }
                                if (predicate.enchantments instanceof List) {
                                    def enchantments = predicate.remove('enchantments').collect { enchantment ->
                                        def converted = new LinkedHashMap(enchantment)
                                        converted.enchantments = converted.remove('enchantment')
                                        converted
                                    }
                                    predicate.predicates = ['minecraft:enchantments': enchantments]
                                }
                            }
                            node.values().each { modernizePredicate(it) }
                        } else if (node instanceof List) node.each { modernizePredicate(it) }
                    }
                    modernizePredicate(loot)
                    leafLoot.text = JsonOutput.prettyPrint(JsonOutput.toJson(loot)) + System.lineSeparator()
                }
            }
        }
        def advancementRoot = destinationDir.toPath().resolve('data/biomemakeover/advancement').toFile()
        if (advancementRoot.exists()) {
            fileTree(advancementRoot).matching { include '**/*.json' }.files.each { advancementFile ->
                def advancement = new JsonSlurper().parse(advancementFile)
                if (advancement.display?.icon instanceof Map && advancement.display.icon.item) {
                    advancement.display.icon.id = advancement.display.icon.remove('item')
                }
                advancement.criteria?.values()?.each { criterion ->
                    criterion.conditions?.items?.each { predicate ->
                        if (predicate.items instanceof List && predicate.items.size() == 1) predicate.items = predicate.items[0]
                        if (predicate.item instanceof List && predicate.item.size() == 1) {
                            predicate.items = predicate.item[0]
                            predicate.remove('item')
                        }
                    }
                    criterion.conditions?.location?.each { term ->
                        if(term instanceof Map && term.predicate?.block instanceof Map && term.predicate.block.block){
                            term.predicate.block.blocks=term.predicate.block.remove('block')
                        }
                        if(term instanceof Map && term.condition=='minecraft:match_tool' && term.predicate?.tag){
                            term.predicate.items="#${term.predicate.remove('tag')}"
                        }
                    }
                }
                if (advancement.requirements instanceof List && advancement.requirements.isEmpty()) advancement.remove('requirements')
                advancementFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(advancement)) + System.lineSeparator()
            }

            // The historical root references the hidden icon_item and two biome
            // branches not yet restored. Keep the Stage 3/4 advancement tree
            // reachable without prematurely registering or activating them.
            def root = [
                display: [
                    icon: [id: 'minecraft:mycelium'],
                    title: [translate: 'advancements.biomemakeover.root.title'],
                    description: [translate: 'advancements.biomemakeover.root.description'],
                    frame: 'task', show_toast: false, announce_to_chat: false, hidden: false,
                    background: 'biomemakeover:textures/gui/advancements.png'
                ],
                criteria: [
                    enter_badlands: [trigger: 'minecraft:location', conditions: [player: [[condition: 'minecraft:entity_properties', entity: 'this', predicate: [location: [biome: 'minecraft:badlands']]]]]],
                    enter_mushroom_fields: [trigger: 'minecraft:location', conditions: [player: [[condition: 'minecraft:entity_properties', entity: 'this', predicate: [location: [biome: 'minecraft:mushroom_fields']]]]]],
                    enter_swamp: [trigger: 'minecraft:location', conditions: [player: [[condition: 'minecraft:entity_properties', entity: 'this', predicate: [location: [biome: 'minecraft:swamp']]]]]]
                ],
                requirements: [['enter_badlands', 'enter_mushroom_fields', 'enter_swamp']]
            ]
            def rootFile = new File(advancementRoot, 'biomemakeover/root.json')
            rootFile.parentFile.mkdirs()
            rootFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(root)) + System.lineSeparator()
        }

        // Paletted-permutation output outside item/ and block/ is not stitched by
        // the 1.21.10 block atlas directory sources. Point the released two-layer
        // Pink Bud model at the identical generated overlay in item/.
        def pinkBudModel = new File(destinationDir, 'assets/biomemakeover/models/item/pink_bud.json')
        if (pinkBudModel.exists()) {
            def model = new JsonSlurper().parse(pinkBudModel)
            model.textures.layer1 = 'biomemakeover:item/pink_bud_overlay'
            pinkBudModel.text = JsonOutput.prettyPrint(JsonOutput.toJson(model)) + System.lineSeparator()
        }
        def magentaBudModel = new File(destinationDir, 'assets/biomemakeover/models/item/magenta_bud.json')
        if (magentaBudModel.exists()) {
            def model = new JsonSlurper().parse(magentaBudModel)
            model.textures.layer1 = 'biomemakeover:item/magenta_bud_overlay'
            magentaBudModel.text = JsonOutput.prettyPrint(JsonOutput.toJson(model)) + System.lineSeparator()
        }
        def contract = new JsonSlurper().parse(file('validation/foundations/stage_3_mushroom_fields_contract.json'))
        def stage4Contract = new JsonSlurper().parse(file('validation/foundations/stage_4_badlands_contract.json'))
        def stage5Contract = new JsonSlurper().parse(file('validation/foundations/stage_5_swamp_contract.json'))
        def allowed = (contract.blocks + contract.no_item_blocks + contract.standalone_items + contract.spawn_eggs + contract.entities +
            stage4Contract.registry.blocks_with_items + stage4Contract.registry.no_item_blocks + stage4Contract.registry.items +
            stage4Contract.registry.spawn_eggs + stage4Contract.registry.entities + stage5Contract.blocks_with_items +
            stage5Contract.no_item_blocks + stage5Contract.special_items + stage5Contract.spawn_eggs + stage5Contract.entities) as Set
        def minecraftTags = destinationDir.toPath().resolve('data/minecraft/tags').toFile()
        if (minecraftTags.exists()) {
            fileTree(minecraftTags).matching { include '**/*.json' }.files.each { tagFile ->
                def tag = new JsonSlurper().parse(tagFile)
                if (tag.values instanceof List) {
                    tag.values = tag.values.findAll { entry ->
                        def id = entry instanceof Map ? entry.id : entry
                        if (id == '#biomemakeover:tapestries') return false
                        !id?.startsWith('biomemakeover:') || allowed.contains(id.substring('biomemakeover:'.length()))
                    }
                    tagFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(tag)) + System.lineSeparator()
                }
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

